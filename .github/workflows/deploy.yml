name: CI/CD - Build & Push a Docker Hub

# Se ejecuta automáticamente en cada push a la rama main
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:        # Permite lanzarlo manualmente desde la pestaña Actions

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen del Backend (API)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/expreso-api:latest

      - name: Construir y publicar imagen Web (Nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/expreso-web:latest
